# Run the Axiom AI test suite on every push / pull request.
#
# The suite is split into THREE batches on purpose: loading PySide6 QtMultimedia
# before importing torch → triton makes the native triton dlopen crash on some
# setups (TICKET-067). Every test that loads QtMultimedia — the ambiance test and
# every test that builds MainWindow (main_window.py imports QtMultimedia) — runs
# in its own pytest process. The in-tree mod tests (mods/*/tests) run in a third
# process, with the isolation fixtures of tests/conftest.py loaded as a plugin.
# All batches must pass. The tests never touch the real ~/.config/AxiomAI or
# ~/AxiomAI (autouse isolation fixture in tests/conftest.py).

name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pytest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12"]
    env:
      # PySide6 has no display in CI; render off-screen.
      QT_QPA_PLATFORM: offscreen
      # Tests whose process builds MainWindow or loads QtMultimedia (TICKET-067).
      QT_MULTIMEDIA_TESTS: >-
        tests/test_ambiance_manager.py
        tests/test_help_system_mod.py
        tests/test_mods_dialog_ui.py
        tests/test_settings_dialog.py
        tests/test_sillytavern_mod.py
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip

      # Persist the downloaded embedding model across runs. Once a single run
      # has populated the cache, every later run loads it offline and never
      # hits the HuggingFace Hub again (see the pre-fetch step below).
      - name: Cache HuggingFace embedding model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: hf-all-MiniLM-L6-v2-v1

      # System libraries PySide6 needs to import head-less.
      - name: Install headless Qt system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libdbus-1-3 libpulse0

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install -r requirements-dev.txt

      # The memory tests need the all-MiniLM-L6-v2 embedding model. On a warm
      # cache it loads offline (no network); on a cold cache we download it with
      # retries to ride out HuggingFace's 429 rate-limiting on shared CI runners
      # (the flaky `assert doc_id != ""` failure in test_update_turn_narrative).
      # If it still can't be fetched we only warn, so the actual test result —
      # not an opaque setup error — is what shows up.
      - name: Pre-fetch embedding model (offline first, retry on download)
        run: |
          if HF_HUB_OFFLINE=1 python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"; then
            echo "embedding model served from cache"
            exit 0
          fi
          for i in 1 2 3 4 5; do
            echo "downloading embedding model (attempt $i)..."
            if python -c "from sentence_transformers import SentenceTransformer; SentenceTransformer('all-MiniLM-L6-v2')"; then
              echo "download ok"
              exit 0
            fi
            sleep $((i * 15))
          done
          echo "::warning::could not pre-fetch embedding model; memory tests may fail"

      # Isolated config/data roots for anything run outside pytest's fixtures.
      - name: Point Axiom AI config and data at temporary folders
        run: |
          echo "AXIOM_CONFIG_DIR=$RUNNER_TEMP/axiom_config" >> "$GITHUB_ENV"
          echo "AXIOM_DATA_DIR=$RUNNER_TEMP/axiom_data" >> "$GITHUB_ENV"

      # Batch 1 — everything except the Qt-multimedia tests.
      - name: Run tests (main batch)
        run: |
          ignores=""
          for f in $QT_MULTIMEDIA_TESTS; do ignores="$ignores --ignore=$f"; done
          pytest tests/ $ignores -q

      # Batch 2 — the Qt-multimedia / MainWindow tests, in their own process.
      # `always()` so it runs even when batch 1 failed, giving a full picture;
      # the job still fails if any batch fails.
      - name: Run tests (Qt multimedia batch)
        if: always()
        run: pytest $QT_MULTIMEDIA_TESTS -q

      # Batch 3 — the in-tree mod test suites.
      - name: Run tests (mods batch)
        if: always()
        run: pytest mods/*/tests -p tests.conftest -q
