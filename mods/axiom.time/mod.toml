[mod]
id = "axiom.time"
version = "1.0.0"
axiom_api = 1
name = "Système Temporel & Chroniqueur"
description = "Gestion du calendrier, estimation du temps des actions, journal Timeline et simulation hors-champ."

[dependencies]
"axiom.world" = ">=1.0.0"
"axiom.turn" = ">=1.0.0"

[ordering]
after = ["axiom.world"]
before = []
provides = ["time_system"]

[contributes]
hooks = [
    "axiom.step:after_step"
]
slots = [
    "axiom.turn:output_fields",
    "axiom.turn:prompt_sections",
    "axiom.ui.qt:sidebar_widget"
]

[storage]
timeline = { policy = "step_keyed_table", table = "Timeline", step_column = "turn_id" }
events = { policy = "step_keyed_table", table = "Scheduled_Events", step_column = "trigger_minute" }
