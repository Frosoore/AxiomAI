[mod]
id = "axiom.time"
version = "1.0.0"
axiom_api = 1
name = "Système Temporel & Chroniqueur"
description = "Gestion du calendrier, estimation du temps des actions, journal Timeline et simulation hors-champ."
author = "Vanilla"

[dependencies]
"axiom.world" = ">=1.0.0"
"axiom.turn" = ">=1.0.0"

[ordering]
after = ["axiom.world"]
before = []
provides = ["time_system"]

[contributes]
hooks = [
    "axiom.step:gather_context",
    "axiom.step:response_parsed",
    "axiom.step:after_step"
]
slots = [
    "axiom.turn:output_fields",
    "axiom.ui.qt:sidebar_widget"
]

[storage]
timeline = { policy = "step_keyed_table", table = "Timeline", step_column = "turn_id", columns = ["event_id", "save_id", "turn_id", "in_game_time", "description"], id_column = "event_id", id_autoincrement = true }
fired_events = { policy = "step_keyed_table", table = "Fired_Scheduled_Events", step_column = "fired_turn_id", columns = ["save_id", "event_id", "fired_turn_id"] }
