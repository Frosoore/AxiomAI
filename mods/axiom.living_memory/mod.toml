[mod]
id = "axiom.living_memory"
version = "1.0.0"
axiom_api = 1
name = "Mémoire Vivante"
description = "Distillation symbolique des faits, croyances et modèles mentaux des entités."
author = "Vanilla"

[dependencies]
"axiom.world" = ">=1.0.0"
"axiom.turn" = ">=1.0.0"

[ordering]
after = ["axiom.world"]
provides = ["living_memory"]

[contributes]
hooks = [
    "axiom.step:after_step"
]
slots = [
    "axiom.turn:prompt_sections",
    "axiom.ui.qt:settings_tab"
]

[storage]
facts = { policy = "step_keyed_table", table = "Facts", step_column = "turn_id", columns = ["fact_id", "save_id", "turn_id", "fact_type", "who", "what", "fact_when", "fact_where", "why", "entities", "statement"], id_column = "fact_id", id_autoincrement = true }
# Beliefs and mental models keep a history and source ids: custom rewind/fork.
observations = { policy = "custom", table = "Observations", rewind = "storage:rewind_observations", fork = "storage:fork_observations" }
mental_models = { policy = "custom", table = "Mental_Models", rewind = "storage:rewind_mental_models", fork = "storage:fork_mental_models" }
