[mod]
id = "axiom.inventory"
version = "1.0.0"
axiom_api = 1
name = "Inventaire Imbriqué Émergent"
description = "Gestion de l'arbre d'objets et conteneurs (profondeur max 5) et snapshots d'inventaire."
author = "Vanilla"

[dependencies]
"axiom.world" = ">=1.0.0"
"axiom.turn" = ">=1.0.0"

[ordering]
after = ["axiom.world"]
provides = ["inventory_system"]

[contributes]
slots = [
    "axiom.turn:output_fields",
    "axiom.turn:prompt_sections",
    "axiom.ui.qt:sidebar_widget"
]

[provides_slots]
"axiom.inventory:actions" = { rule = "collect" }

[storage]
# Instances hold their container ids: rewound/forked by inventory code (snapshot-based).
item_instances = { policy = "custom", table = "Item_Instances", rewind = "storage:rewind_inventory", fork = "storage:fork_item_instances", snapshot = "storage:snapshot_inventory", section = "inventory", state = "storage:state_inventory", load = "storage:load_inventory", diff = "storage:diff_inventory" }
inventory_snapshots = { policy = "step_keyed_table", table = "Inventory_Snapshots", step_column = "turn_id", columns = ["save_id", "turn_id", "state_json"], fork_with = "Item_Instances" }
# Legacy flat bag of old saves (not turn-keyed): copied at fork time.
legacy_bag = { policy = "custom", table = "Items_Inventory", fork = "storage:fork_legacy_inventory" }
